
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CardTurnTracker card_tracker.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CardTurnTracker-Windows-EXE
          path: dist/CardTurnTracker.exe
          if-no-files-found: error